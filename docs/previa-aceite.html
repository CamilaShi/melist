            &lt;span class=&quot;nav-icone&quot;&gt;&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4&quot;&gt;&lt;/path&gt;&lt;polyline points=&quot;16 17 21 12 16 7&quot;&gt;&lt;/polyline&gt;&lt;line x1=&quot;21&quot; y1=&quot;12&quot; x2=&quot;9&quot; y2=&quot;12&quot;&gt;&lt;/line&gt;&lt;/svg&gt;&lt;/span&gt; Sair
          &lt;/button&gt;
          &lt;label class=&quot;interruptor-tema&quot; aria-label=&quot;Alternar tema&quot;&gt;
            &lt;input type=&quot;checkbox&quot; id=&quot;toggleTemaRodape&quot; onchange=&quot;alternarTema()&quot;&gt;
            &lt;span class=&quot;interruptor-tema-trilho&quot;&gt;
              &lt;span class=&quot;interruptor-tema-bola&quot;&gt;&lt;/span&gt;
              &lt;span class=&quot;interruptor-tema-icone&quot; id=&quot;iconeTemaRodape&quot;&gt;&amp;#9790;&lt;/span&gt;
            &lt;/span&gt;
          &lt;/label&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/aside&gt;

    &lt;main class=&quot;conteudo&quot;&gt;

      &lt;!-- VISTA: lista de checklists --&gt;
      &lt;div id=&quot;vistaLista&quot;&gt;
        &lt;div class=&quot;topo&quot;&gt;
          &lt;div class=&quot;selo-topo&quot;&gt;Painel&lt;/div&gt;
          &lt;h1&gt;Meus Checklists&lt;/h1&gt;
        &lt;/div&gt;
        &lt;div class=&quot;grade-checklists&quot; id=&quot;gradeChecklists&quot;&gt;
          &lt;div class=&quot;estado-vazio&quot;&gt;Carregando...&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- VISTA: Histórico (quando cada checklist foi salvo/feito) --&gt;
      &lt;div id=&quot;vistaHistorico&quot; style=&quot;display:none;&quot;&gt;
        &lt;div class=&quot;topo&quot;&gt;
          &lt;div class=&quot;selo-topo&quot;&gt;Painel&lt;/div&gt;
          &lt;h1&gt;Histórico&lt;/h1&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cartao-historico&quot; id=&quot;listaHistorico&quot;&gt;
          &lt;div class=&quot;estado-vazio&quot;&gt;Carregando...&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- VISTA: itens de um checklist --&gt;
      &lt;div id=&quot;vistaItens&quot; style=&quot;display:none;&quot;&gt;
        &lt;button class=&quot;botao-voltar&quot; onclick=&quot;voltarParaLista()&quot;&gt;&amp;#8592; Voltar para Meus Checklists&lt;/button&gt;
        &lt;div class=&quot;painel-itens&quot;&gt;
          &lt;div class=&quot;painel-itens-topo&quot;&gt;
            &lt;h2 id=&quot;tituloChecklist&quot; class=&quot;titulo-editavel&quot; title=&quot;Clique para renomear&quot; onclick=&quot;iniciarEdicaoTituloChecklist()&quot;&gt;Checklist&lt;/h2&gt;
            &lt;div class=&quot;topo-direita&quot;&gt;
              &lt;span class=&quot;icones-titulo&quot; id=&quot;iconesTituloChecklist&quot;&gt;
                &lt;button class=&quot;icone-config&quot; onclick=&quot;abrirConfigChecklist()&quot; title=&quot;Configurações do checklist&quot;&gt;
                  &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot;&gt;
                    &lt;line x1=&quot;4&quot; y1=&quot;6&quot; x2=&quot;20&quot; y2=&quot;6&quot;&gt;&lt;/line&gt;
                    &lt;circle cx=&quot;9&quot; cy=&quot;6&quot; r=&quot;2.3&quot; fill=&quot;currentColor&quot;&gt;&lt;/circle&gt;
                    &lt;line x1=&quot;4&quot; y1=&quot;12&quot; x2=&quot;20&quot; y2=&quot;12&quot;&gt;&lt;/line&gt;
                    &lt;circle cx=&quot;16&quot; cy=&quot;12&quot; r=&quot;2.3&quot; fill=&quot;currentColor&quot;&gt;&lt;/circle&gt;
                    &lt;line x1=&quot;4&quot; y1=&quot;18&quot; x2=&quot;20&quot; y2=&quot;18&quot;&gt;&lt;/line&gt;
                    &lt;circle cx=&quot;11&quot; cy=&quot;18&quot; r=&quot;2.3&quot; fill=&quot;currentColor&quot;&gt;&lt;/circle&gt;
                  &lt;/svg&gt;
                &lt;/button&gt;
                &lt;button class=&quot;icone-pdf&quot; onclick=&quot;salvarChecklistEmPdf()&quot; title=&quot;Salvar em PDF&quot;&gt;
                  &lt;svg viewBox=&quot;0 0 48 48&quot; fill=&quot;none&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;&gt;
                    &lt;defs&gt;
                      &lt;linearGradient id=&quot;faixaIconePdf&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;1&quot; y2=&quot;0&quot;&gt;
                        &lt;stop offset=&quot;0&quot; style=&quot;stop-color: var(--pdf-faixa-ini);&quot;/&gt;
                        &lt;stop offset=&quot;1&quot; style=&quot;stop-color: var(--pdf-faixa-fim);&quot;/&gt;
                      &lt;/linearGradient&gt;
                    &lt;/defs&gt;
                    &lt;path d=&quot;M10 4 H30 L38 12 V40 Q38 42 36 42 H10 Q8 42 8 40 V6 Q8 4 10 4 Z&quot; style=&quot;fill: var(--pdf-doc-fundo); stroke: var(--pdf-doc-traco);&quot; stroke-width=&quot;2&quot; stroke-linejoin=&quot;round&quot;/&gt;
                    &lt;path d=&quot;M30 4 V10 Q30 12 32 12 H38 Z&quot; style=&quot;fill: var(--pdf-doc-fundo); stroke: var(--pdf-doc-traco);&quot; stroke-width=&quot;2&quot; stroke-linejoin=&quot;round&quot;/&gt;
                    &lt;line x1=&quot;13&quot; y1=&quot;16&quot; x2=&quot;30&quot; y2=&quot;16&quot; style=&quot;stroke: var(--pdf-doc-traco);&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;
                    &lt;g transform=&quot;rotate(-9 24 33)&quot;&gt;
                      &lt;rect x=&quot;-6.5&quot; y=&quot;23.5&quot; width=&quot;61&quot; height=&quot;20&quot; rx=&quot;4&quot; fill=&quot;url(#faixaIconePdf)&quot; style=&quot;stroke: var(--pdf-doc-traco);&quot; stroke-width=&quot;1&quot;/&gt;
                      &lt;text x=&quot;24&quot; y=&quot;39&quot; text-anchor=&quot;middle&quot; font-family=&quot;Inter, sans-serif&quot; font-size=&quot;18&quot; font-weight=&quot;800&quot; style=&quot;fill: var(--pdf-faixa-texto);&quot;&gt;PDF&lt;/text&gt;
                    &lt;/g&gt;
                  &lt;/svg&gt;
                &lt;/button&gt;
                &lt;button class=&quot;icone-duplicar&quot; id=&quot;botaoDuplicarChecklist&quot; onclick=&quot;duplicarChecklistAtual()&quot; title=&quot;Duplicar checklist (copia tudo pra uma lista nova)&quot;&gt;
                  &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;
                    &lt;rect x=&quot;8&quot; y=&quot;8&quot; width=&quot;13&quot; height=&quot;13&quot; rx=&quot;2&quot;&gt;&lt;/rect&gt;
                    &lt;path d=&quot;M4 16V4a2 2 0 0 1 2-2h10&quot;&gt;&lt;/path&gt;
                  &lt;/svg&gt;
                &lt;/button&gt;
                &lt;button class=&quot;icone-duplicar&quot; id=&quot;botaoEnviarChecklist&quot; onclick=&quot;abrirEnvioChecklist()&quot; title=&quot;Enviar uma cópia para outro usuário (ele precisa aceitar)&quot;&gt;
                  &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;
                    &lt;line x1=&quot;22&quot; y1=&quot;2&quot; x2=&quot;11&quot; y2=&quot;13&quot;&gt;&lt;/line&gt;
                    &lt;polygon points=&quot;22 2 15 22 11 13 2 9 22 2&quot;&gt;&lt;/polygon&gt;
                  &lt;/svg&gt;
                &lt;/button&gt;
                &lt;button class=&quot;icone-lixeira&quot; onclick=&quot;excluirChecklistAtual()&quot; title=&quot;Excluir checklist&quot;&gt;&amp;#128465;&lt;/button&gt;
              &lt;/span&gt;
              &lt;span class=&quot;widget-tag&quot; id=&quot;dataAtual&quot;&gt;&lt;/span&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;progresso-painel&quot; id=&quot;progressoPainel&quot;&gt;
            &lt;div class=&quot;progresso-texto&quot;&gt;
              &lt;span id=&quot;progressoTexto&quot;&gt;0 de 0 concluídos&lt;/span&gt;
              &lt;span class=&quot;progresso-percentual&quot; id=&quot;progressoPercentual&quot;&gt;0%&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;progresso-trilha&quot;&gt;&lt;span id=&quot;progressoBarra&quot; style=&quot;width:0%&quot;&gt;&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;acoes-itens&quot; id=&quot;acoesNormais&quot;&gt;
            &lt;div class=&quot;acoes-itens-esquerda&quot;&gt;
              &lt;button class=&quot;botao-mini&quot; onclick=&quot;marcarTodos(true)&quot;&gt;Marcar tudo&lt;/button&gt;
              &lt;button class=&quot;botao-mini&quot; onclick=&quot;marcarTodos(false)&quot;&gt;Limpar tudo&lt;/button&gt;
              &lt;div class=&quot;bloco-botao-historico&quot;&gt;
                &lt;button class=&quot;botao-mini botao-historico&quot; id=&quot;botaoSalvarHistorico&quot; onclick=&quot;salvarNoHistorico()&quot;&gt;
                  &lt;svg class=&quot;icone-salvar-historico&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; stroke-linejoin=&quot;round&quot; stroke-linecap=&quot;round&quot;&gt;
                    &lt;path d=&quot;M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z&quot;&gt;&lt;/path&gt;
                    &lt;path d=&quot;M8 4v5h7V4&quot;&gt;&lt;/path&gt;
                    &lt;rect x=&quot;7.5&quot; y=&quot;13&quot; width=&quot;9&quot; height=&quot;6&quot;&gt;&lt;/rect&gt;
                  &lt;/svg&gt;
                  Salvar no histórico
                &lt;/button&gt;
                &lt;span class=&quot;info-ultimo-historico&quot; id=&quot;infoUltimoHistorico&quot;&gt;&lt;/span&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;lista-itens&quot; id=&quot;listaItens&quot;&gt;
            &lt;div class=&quot;estado-vazio&quot;&gt;Carregando...&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- Área só usada para gerar o PDF via window.print(); fica oculta na tela normal. --&gt;
      &lt;div id=&quot;areaImpressaoPdf&quot;&gt;&lt;/div&gt;

    &lt;/main&gt;
  &lt;/div&gt;

  &lt;div class=&quot;janela-overlay&quot; id=&quot;janelaConfigChecklist&quot; style=&quot;display:none;&quot;&gt;
    &lt;div class=&quot;janela-config&quot;&gt;
      &lt;h2 id=&quot;tituloConfigChecklist&quot;&gt;Configurações&lt;/h2&gt;
      &lt;p class=&quot;subtitulo&quot;&gt;Só valem pra este checklist.&lt;/p&gt;

      &lt;div class=&quot;linha-opcao&quot;&gt;
        &lt;div class=&quot;opcao-texto&quot;&gt;
          &lt;strong&gt;Registrar no histórico&lt;/strong&gt;
          &lt;span&gt;Guarda uma linha no Histórico com data, hora e o que estava marcado.&lt;/span&gt;
        &lt;/div&gt;
        &lt;label class=&quot;interruptor&quot;&gt;
          &lt;input type=&quot;checkbox&quot; id=&quot;toggleRegistrarHistorico&quot;&gt;
          &lt;span class=&quot;interruptor-trilho&quot;&gt;&lt;span class=&quot;interruptor-bola&quot;&gt;&lt;/span&gt;&lt;/span&gt;
        &lt;/label&gt;
      &lt;/div&gt;

      &lt;div class=&quot;linha-opcao&quot;&gt;
        &lt;div class=&quot;opcao-texto&quot;&gt;
          &lt;strong&gt;Zerar os itens todo dia&lt;/strong&gt;
          &lt;span&gt;De madrugada, desmarca tudo sozinho — pra checklists que você refaz todo dia, como o Dia a Dia. Desligado, o item continua marcado nos dias seguintes até você desmarcar ou clicar em &quot;Limpar tudo&quot; — pra checklists como o de Viagem.&lt;/span&gt;
        &lt;/div&gt;
        &lt;label class=&quot;interruptor&quot;&gt;
          &lt;input type=&quot;checkbox&quot; id=&quot;toggleZerarDiario&quot;&gt;
          &lt;span class=&quot;interruptor-trilho&quot;&gt;&lt;span class=&quot;interruptor-bola&quot;&gt;&lt;/span&gt;&lt;/span&gt;
        &lt;/label&gt;
      &lt;/div&gt;

      &lt;div class=&quot;janela-botoes&quot;&gt;
        &lt;button class=&quot;botao-fechar&quot; onclick=&quot;fecharConfigChecklist()&quot;&gt;Cancelar&lt;/button&gt;
        &lt;button class=&quot;botao-salvar&quot; onclick=&quot;salvarConfigChecklist()&quot;&gt;Salvar&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;janela-overlay&quot; id=&quot;janelaReceberChecklist&quot; style=&quot;display:flex;&quot;&gt;
    &lt;div class=&quot;janela-config&quot;&gt;
      &lt;h2 id=&quot;tituloReceberChecklist&quot;&gt;Checklist recebido&lt;/h2&gt;
      &lt;p class=&quot;subtitulo&quot; id=&quot;textoReceberChecklist&quot;&gt;Camila quer te enviar o checklist &quot;Viagem&quot;. Deseja aceitar? Se aceitar, ele entra na sua lista como uma cópia sua, sem marcações.&lt;/p&gt;
      &lt;p class=&quot;subtitulo&quot; id=&quot;contadorReceber&quot;&gt;&lt;/p&gt;
      &lt;div class=&quot;mensagem&quot; id=&quot;msgReceber&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;janela-botoes&quot;&gt;
        &lt;button class=&quot;botao-fechar&quot; id=&quot;botaoRecusarEnvio&quot; onclick=&quot;responderEnvio(false)&quot;&gt;Recusar&lt;/button&gt;
        &lt;button class=&quot;botao-salvar&quot; id=&quot;botaoAceitarEnvio&quot; onclick=&quot;responderEnvio(true)&quot;&gt;Aceitar&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;janela-overlay&quot; id=&quot;janelaEnvioChecklist&quot; style=&quot;display:none;&quot;&gt;
    &lt;div class=&quot;janela-config&quot;&gt;
      &lt;h2 id=&quot;tituloEnvioChecklist&quot;&gt;Enviar checklist&lt;/h2&gt;
      &lt;p class=&quot;subtitulo&quot;&gt;A pessoa vê um aviso e escolhe se aceita. Se aceitar, recebe uma cópia sem marcações e sem fotos. O que ela mudar não altera o seu.&lt;/p&gt;
      &lt;div class=&quot;campo-login&quot;&gt;
        &lt;label&gt;E-mail do usuário
          &lt;input type=&quot;email&quot; id=&quot;campoEmailEnvio&quot; autocomplete=&quot;off&quot; placeholder=&quot;nome@email.com&quot;&gt;
        &lt;/label&gt;
        &lt;div class=&quot;mensagem&quot; id=&quot;msgEnvio&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;janela-botoes&quot;&gt;
        &lt;button class=&quot;botao-fechar&quot; onclick=&quot;fecharEnvioChecklist()&quot;&gt;Cancelar&lt;/button&gt;
        &lt;button class=&quot;botao-salvar&quot; id=&quot;botaoConfirmarEnvio&quot; onclick=&quot;enviarChecklistAtual()&quot;&gt;Enviar&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;janela-overlay&quot; id=&quot;janelaFotosItem&quot; style=&quot;display:none;&quot;&gt;
    &lt;div class=&quot;janela-config janela-fotos&quot;&gt;
      &lt;h2 id=&quot;tituloFotosItem&quot;&gt;Fotos do item&lt;/h2&gt;
      &lt;p class=&quot;subtitulo&quot;&gt;Ficam guardadas com segurança — só quem está logada vê essas fotos.&lt;/p&gt;

      &lt;div class=&quot;grade-fotos-item&quot; id=&quot;gradeFotosItem&quot;&gt;&lt;/div&gt;

      &lt;label class=&quot;botao-add-foto&quot; id=&quot;botaoAddFoto&quot;&gt;
        &lt;input type=&quot;file&quot; accept=&quot;image/*&quot; id=&quot;inputFotoItem&quot; style=&quot;display:none;&quot; onchange=&quot;onAdicionarFotoSelecionada(event)&quot;&gt;
        &lt;span id=&quot;textoBotaoAddFoto&quot;&gt;+ Adicionar foto&lt;/span&gt;
      &lt;/label&gt;

      &lt;div class=&quot;janela-botoes&quot;&gt;
        &lt;button class=&quot;botao-fechar&quot; onclick=&quot;fecharGaleriaItem()&quot;&gt;Fechar&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;janela-overlay&quot; id=&quot;janelaCopiarSecao&quot; style=&quot;display:none;&quot;&gt;
    &lt;div class=&quot;janela-config&quot;&gt;
      &lt;h2 id=&quot;tituloCopiarSecao&quot;&gt;Copiar lista&lt;/h2&gt;
      &lt;p class=&quot;subtitulo&quot; id=&quot;subtituloCopiarSecao&quot;&gt;Copia os itens desta lista pra outro checklist — a lista original continua aqui do mesmo jeito.&lt;/p&gt;

      &lt;div class=&quot;linha-destino&quot;&gt;
        &lt;label class=&quot;opcao-radio&quot;&gt;
          &lt;input type=&quot;radio&quot; name=&quot;destinoCopiarSecao&quot; id=&quot;radioDestinoExistente&quot; checked onchange=&quot;atualizarDestinoCopiarSecao()&quot;&gt;
          Checklist existente
        &lt;/label&gt;
        &lt;select id=&quot;selectChecklistDestino&quot; class=&quot;select-hora&quot;&gt;&lt;/select&gt;
      &lt;/div&gt;

      &lt;div class=&quot;linha-destino&quot;&gt;
        &lt;label class=&quot;opcao-radio&quot;&gt;
          &lt;input type=&quot;radio&quot; name=&quot;destinoCopiarSecao&quot; id=&quot;radioDestinoNovo&quot; onchange=&quot;atualizarDestinoCopiarSecao()&quot;&gt;
          Criar um checklist novo
        &lt;/label&gt;
        &lt;input type=&quot;text&quot; id=&quot;campoNomeNovoChecklistDestino&quot; class=&quot;campo-nova-secao&quot; placeholder=&quot;Nome do novo checklist...&quot; disabled&gt;
      &lt;/div&gt;

      &lt;div class=&quot;linha-destino&quot;&gt;
        &lt;label class=&quot;opcao-radio&quot;&gt;
          &lt;input type=&quot;radio&quot; name=&quot;destinoCopiarSecao&quot; id=&quot;radioDestinoTexto&quot; onchange=&quot;atualizarDestinoCopiarSecao()&quot;&gt;
          Copiar como texto (pra colar no WhatsApp, bloco de notas...)
        &lt;/label&gt;
      &lt;/div&gt;

      &lt;div class=&quot;janela-botoes&quot;&gt;
        &lt;button class=&quot;botao-fechar&quot; onclick=&quot;fecharCopiarSecao()&quot;&gt;Cancelar&lt;/button&gt;
        &lt;button class=&quot;botao-salvar&quot; id=&quot;botaoConfirmarCopiarSecao&quot; onclick=&quot;confirmarCopiarSecao()&quot;&gt;Copiar&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  
  
  
  
&lt;/body&gt;
&lt;/html&gt;
"></iframe></body></html>
